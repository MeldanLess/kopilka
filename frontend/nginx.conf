server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ассеты с хешем в имени можно кэшировать навсегда; точка входа — нет.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Одностраничное приложение: любой неизвестный путь обрабатывает роутер в
    # браузере, поэтому нужно отдать точку входа, а не 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types application/javascript application/json text/css text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
