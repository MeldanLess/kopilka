# nginx перед «Копилкой»: фронтенд и API.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kopilka
#   sudo ln -s /etc/nginx/sites-available/kopilka /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS терминируется здесь: certbot кладёт сертификат в /etc/letsencrypt/, а
# этот файл переписывается так, чтобы всё шло на HTTPS.

upstream kopilka_frontend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream kopilka_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tracker.example.com;

    # Проверка ACME от certbot должна остаться на обычном HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tracker.example.com;

    # Этими файлами управляет certbot; `certbot --nginx` переписывает пути
    # на месте.
    ssl_certificate     /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain;
    gzip_min_length 1024;

    # Фронтенд: статика, отдаётся контейнером с nginx внутри.
    location / {
        proxy_pass http://kopilka_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: путь начинается с /api, чтобы не конфликтовать со статикой
    # фронтенда (одностраничное приложение живёт по корню).
    location /api/ {
        proxy_pass http://kopilka_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
