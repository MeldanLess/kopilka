name: CI

# Проверяет стиль и запускает тесты при каждом пуше и каждом pull request.
#
# Тесты выполняются против настоящего сервиса PostgreSQL — того же движка,
# тех же типов и ограничений, что и в бою. Против SQLite было бы быстрее, но
# там скрываются ошибки, которые как раз нужно ловить: колонки UUID, нативные
# типы enum, `NUMERIC` для денег и ограничения внешних ключей.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Бэкенд — стиль и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kopilka
          POSTGRES_PASSWORD: kopilka
          POSTGRES_DB: kopilka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kopilka -d kopilka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://kopilka:kopilka@localhost:5432/kopilka
      SECRET_KEY: ci-only-insecure-secret-key-not-used-in-production
      ENVIRONMENT: test

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Готовим Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Ставим зависимости
        run: pip install -r requirements-dev.txt

      - name: Проверяем стиль
        run: ruff check .

      - name: Запускаем тесты
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Выкладываем отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Фронтенд — типы, стиль и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Готовим Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Кэшируем по package.json: lock-файла в репозитории пока нет, он
          # появится после первой локальной установки.
          cache-dependency-path: frontend/package.json

      - name: Ставим зависимости
        run: npm install

      - name: Проверяем стиль
        run: npm run lint

      - name: Проверяем типы и тесты
        run: npm run build

      - name: Запускаем тесты
        run: npm test

      - name: Выкладываем отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore
