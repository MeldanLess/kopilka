name: Публикация образа

# Собирает образы контейнеров и отправляет их в GitHub Container Registry,
# когда отправлен тег с версией. Именно тег тянет сервер, поэтому релиз —
# это `git tag` и пуш: та же дисциплина релизов, что и у тега `v1.0.0`,
# который требуют соглашения портфолио.
#
# Образов два: бэкенд и фронтенд. Фронтенд собирается отдельно, потому что
# адрес API зашивается в его бандл на этапе сборки.
#
# Тесты выполняются первыми, в той же задаче: образ, не прошедший собственный
# набор тестов, в реестр не попадает.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Тесты, сборка и отправка
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kopilka
          POSTGRES_PASSWORD: kopilka
          POSTGRES_DB: kopilka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kopilka -d kopilka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://kopilka:kopilka@localhost:5432/kopilka
      SECRET_KEY: ci-only-insecure-secret-key-not-used-in-production
      ENVIRONMENT: test

    steps:
      - name: Готовим имя образа
        id: image
        # Путь в реестре контейнеров обязан быть строчным, а `github.repository`
        # сохраняет регистр владельца (`MeldanLess/kopilka`). Без приведения к
        # нижнему регистру сборка падает с «repository name must be lowercase».
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Готовим Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Готовим Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ставим зависимости бэкенда
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Ставим зависимости фронтенда
        run: npm ci
        working-directory: frontend

      # Проверки здесь — ровно те же, что и в основном CI: линтер, типы и
      # тесты. Сборка образа не должна быть строже того, что уже зелёное.
      - name: Проверяем стиль бэкенда
        run: ruff check .
        working-directory: backend

      - name: Проверяем стиль фронтенда
        run: npm run lint
        working-directory: frontend

      - name: Проверяем типы фронтенда
        run: npm run build
        working-directory: frontend

      - name: Запускаем тесты бэкенда
        run: pytest --cov=app --cov-report=term-missing
        working-directory: backend

      - name: Запускаем тесты фронтенда
        run: npm run test:coverage
        working-directory: frontend

      - name: Входим в реестр контейнеров
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собираем и отправляем образ бэкенда
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-api:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-api:latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}-api
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Собираем и отправляем образ фронтенда
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Адрес API в образе фронтенда — это то, что видит браузер, а не
          # внутренний адрес контейнера: поэтому он передаётся явно.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-frontend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-frontend:latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}-frontend
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
